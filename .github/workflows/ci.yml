name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-self-scan:
    name: Test & Self-Scan (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test & static analysis tools (mypy, pytest, ruff)
        run: |
          python -m pip install --upgrade pip "mypy>=1.11" "pytest>=8.0" "ruff>=0.8"

      - name: Run ruff lint, format check & strict mypy
        run: |
          ruff check scripts tests
          ruff format --check scripts tests
          mypy scripts tests

      - name: Run scanner selftest & maintenance check
        run: |
          python -B scripts/vi_scanner.py selftest
          python -B scripts/vi_scanner.py check-maintenance

      - name: Run pytest suite (100+ fixtures, code limits & skill manifest checks)
        run: |
          python -B -m pytest -v

      - name: Self-scan all repository Markdown documents
        run: |
          python -B scripts/vi_scanner.py scan SKILL.md AGENTS.md README.md CONTRIBUTING.md CHANGELOG.md .github/PULL_REQUEST_TEMPLATE.md references/rule-catalog.md references/voice-and-argument-patterns.md references/loanwords-and-exceptions.md --fail-on any --json
